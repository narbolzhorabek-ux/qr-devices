<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка ОТУ — ICA</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page { max-width: 540px; margin: 0 auto; padding: 0 0 60px; }
    .device-header {
      background: var(--accent);
      padding: 16px 20px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .device-header .logo { display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:14px; }
    .device-header img { height: 30px; }
    .tab-pills {
      display: flex;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      overflow-x: auto;
    }
    .tab-pill {
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab-pill.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-pane { display: none; padding: 16px; }
    .tab-pane.active { display: block; }
    .done-btn-wrap { padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); position: sticky; bottom: 0; }
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-zone:hover { border-color: var(--accent); }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    .required-tag {
      background: var(--red-dim);
      color: var(--red);
      border: 1px solid var(--red);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 100px;
    }
    .ok-tag {
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid var(--green);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 100px;
    }
  </style>
</head>

    <div id="headerRight" style="display:flex;align-items:center;gap:8px;font-size:12px;"></div>
  </div>

  <!-- DEVICE INFO -->
  <div id="deviceInfo" style="padding:16px;">
    <div class="loading">Загрузка...</div>
  </div>

  <!-- TABS -->
  <div id="tabsWrap" style="display:none;">
    <div class="tab-pills" id="tabPills"></div>

    <!-- Паспорт -->
    <div class="tab-pane active" id="pane-passport">
      <div id="passportContent"><div class="loading">Загрузка...</div></div>
    </div>

    <!-- Документы -->
    <div class="tab-pane" id="pane-docs">
      <div id="docsContent"><div class="loading">Загрузка...</div></div>
      <div id="uploadSection" style="display:none;margin-top:16px;">
        <div style="font-weight:600;margin-bottom:8px;">Загрузить файл</div>
        <div class="upload-zone" onclick="document.getElementById('fileUploadInput').click()">
          <div style="font-size:28px;">📁</div>
          <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">Нажмите для загрузки (макс. 20MB)</div>
          <input type="file" id="fileUploadInput" style="display:none" onchange="uploadFileFromDevice(this)">
        </div>
        <label style="display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;font-size:13px;font-weight:400;">
          <input type="checkbox" id="uploadVisible" style="width:auto;"> Видно персоналу
        </label>
        <div class="alert" id="uploadAlert" style="margin-top:8px;"></div>
      </div>
    </div>

    <!-- ТО -->
    <div class="tab-pane" id="pane-to">
      <div id="toContent"><div class="loading">Загрузка...</div></div>

      <!-- Кнопка Выполнено (только для ИТР+) -->
      <div id="doneSection" style="display:none;margin-top:16px;">
        <div class="card" style="border:2px solid var(--border);">
          <div style="font-weight:700;font-size:15px;margin-bottom:8px;">✅ Зафиксировать выполнение ТО</div>
          <div id="doneRequirements" style="margin-bottom:12px;"></div>
          <div class="form-group">
            <label>Заметки о проведённом ТО</label>
            <textarea id="doneNotes" rows="3" placeholder="Что было сделано, выявленные замечания..."></textarea>
          </div>
          <div class="alert" id="doneAlert"></div>
          <button class="btn btn-primary" id="doneBtn" onclick="markDone()" disabled style="opacity:0.5;">
            ✅ Отметить выполненным
          </button>
