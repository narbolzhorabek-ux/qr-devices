      <div class="alert alert-error show" id="error" style="display:none;"></div>

      <div class="form-group">
        <label>ИИН (12 цифр)</label>
        <input type="text" id="iin" inputmode="numeric" maxlength="12" placeholder="000000000000" autocomplete="off">
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button class="btn btn-primary" id="loginBtn" onclick="login()">Войти в систему</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const errorEl = document.getElementById('error');
    if (getUser()) window.location.href = 'admin.html';

    document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
    document.getElementById('iin').addEventListener('input', function() { this.value = this.value.replace(/\D/g,''); });

    async function login() {
      const iin = document.getElementById('iin').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');

      errorEl.style.display = 'none';

      if (iin.length !== 12) { showError('ИИН должен содержать ровно 12 цифр'); return; }
      if (!password) { showError('Введите пароль'); return; }

      btn.textContent = 'Проверка...';
      btn.disabled = true;

      const { data, error } = await db
        .from('users')
        .select('id, full_name, role, service_id')
        .eq('iin', iin)
        .eq('password_hash', password)
        .single();

      btn.textContent = 'Войти в систему';
      btn.disabled = false;

      if (error || !data) { showError('Неверный ИИН или пароль'); return; }

      setUser(data);
      const adminRoles = ['superadmin', 'admin', 'chief', 'itr'];
      window.location.href = adminRoles.includes(data.role) ? 'admin.html' : 'device.html';
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      errorEl.className = 'alert alert-error show';
    }
  </script>

</html>
